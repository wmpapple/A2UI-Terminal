name: Windows installer smoke build

# This workflow intentionally produces an unsigned internal test installer.
# Production publication remains blocked until certificate and updater keys are configured.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Build unsigned NSIS and MSI test packages
        uses: tauri-apps/tauri-action@v0

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a2ui-terminal-windows-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
