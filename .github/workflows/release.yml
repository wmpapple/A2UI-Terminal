name: Legacy desktop build

# This manual workflow only validates the current Tauri 1 prototype.
# M0-C will replace it with the signed Tauri 2 release and updater workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Build unsigned desktop test package
        uses: tauri-apps/tauri-action@v0

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: a2ui-terminal-windows-unsigned
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
