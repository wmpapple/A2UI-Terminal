[package]
name = "a2ui-terminal"
version = "0.1.9"
description = "Desktop-first AI workspace with controlled file editing"
authors = ["A2UI Terminal contributors"]
license = "UNLICENSED"
default-run = "a2ui-terminal"
edition = "2021"
rust-version = "1.85"

[lib]
name = "a2ui_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
csv = "1.3.1"
docx-rs = { version = "=0.4.22", default-features = false }
keyring = { version = "4.1.6", features = ["v1"] }
futures-util = "0.3.31"
pdf-extract = "0.10.0"
printpdf = { version = "=0.7.0", default-features = false, features = ["font_subsetting"] }
pulldown-cmark = { version = "=0.13.0", default-features = false }
quick-xml = "0.39.2"
reqwest = { version = "0.12.28", features = ["json", "stream"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
rust_xlsxwriter = "=0.99.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
tempfile = "3"
ttf-parser = "=0.19.2"
thiserror = "2.0.19"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4"] }
walkdir = "2.5.0"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
zeroize = "1.8.1"

[features]
custom-protocol = ["tauri/custom-protocol"]
