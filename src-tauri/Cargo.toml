[package]
name = "a2ui-terminal"
version = "0.1.0"
description = "Desktop-first AI workspace with controlled file editing"
authors = ["A2UI Terminal contributors"]
license = "UNLICENSED"
default-run = "a2ui-terminal"
edition = "2021"
rust-version = "1.85"

[lib]
name = "a2ui_terminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
keyring = { version = "4.1.6", features = ["v1"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
thiserror = "2.0.19"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
